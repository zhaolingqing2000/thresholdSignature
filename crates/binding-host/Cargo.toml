[package]
name = "binding-host"
version = "0.1.0"
edition = "2021"

[features]
default = ["mock-nizk"]
mock-nizk = []
sp1-groth16 = ["sp1-nizk"]
sp1-nizk = [
    "dep:sp1-build",
    "dep:sp1-core-executor",
    "dep:sp1-core-executor-runner",
    "dep:sp1-core-executor-runner-binary",
    "dep:sp1-core-machine",
    "dep:sp1-curves",
    "dep:sp1-derive",
    "dep:sp1-hypercube",
    "dep:sp1-jit",
    "dep:sp1-lib",
    "dep:sp1-primitives",
    "dep:sp1-prover",
    "dep:sp1-prover-types",
    "dep:sp1-recursion-circuit",
    "dep:sp1-recursion-compiler",
    "dep:sp1-recursion-executor",
    "dep:sp1-recursion-gnark-ffi",
    "dep:sp1-recursion-machine",
    "dep:sp1-sdk",
    "dep:sp1-verifier",
]

[dependencies]
binding-core = { path = "../binding-core" }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10.9"
zeroize = "1.8"
bincode = "1.3"
sp1-sdk = { version = "=6.1.0", features = ["blocking", "native-gnark"], optional = true }
sp1-build = { version = "=6.1.0", optional = true }
sp1-core-executor = { version = "=6.1.0", optional = true }
sp1-core-executor-runner = { version = "=6.1.0", optional = true }
sp1-core-executor-runner-binary = { version = "=6.1.0", optional = true }
sp1-core-machine = { version = "=6.1.0", optional = true }
sp1-curves = { version = "=6.1.0", optional = true }
sp1-derive = { version = "=6.1.0", optional = true }
sp1-hypercube = { version = "=6.1.0", optional = true }
sp1-jit = { version = "=6.1.0", optional = true }
sp1-lib = { version = "=6.1.0", optional = true }
sp1-primitives = { version = "=6.1.0", optional = true }
sp1-prover = { version = "=6.1.0", optional = true }
sp1-prover-types = { version = "=6.1.0", optional = true }
sp1-recursion-circuit = { version = "=6.1.0", optional = true }
sp1-recursion-compiler = { version = "=6.1.0", optional = true }
sp1-recursion-executor = { version = "=6.1.0", optional = true }
sp1-recursion-gnark-ffi = { version = "=6.1.0", optional = true }
sp1-recursion-machine = { version = "=6.1.0", optional = true }
sp1-verifier = { version = "=6.1.0", optional = true }
