[package]
name = "threshold_signature"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    ".",
    "crates/binding-core",
    "crates/binding-host",
    "crates/binding-program",
]
default-members = ["crates/binding-program"]
resolver = "2"

[features]
default = ["test-backend"]
test-backend = []
concrete-lhtlp = ["dep:openssl", "dep:hex"]
concrete-ibe = ["dep:ibe", "dep:rand08", "dep:rand_chacha08", "dep:serde_json", "dep:hex"]
concrete-binding = ["sp1-nizk"]
mock-nizk = []
sp1-nizk = ["dep:serde_json", "binding-host/sp1-nizk", "dep:hex"]
sp1-groth16 = ["sp1-nizk", "binding-host/sp1-groth16"]

[dependencies]
curve25519-dalek = "4.1.3"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
rand = "0.9.2"

aes-gcm = "0.10"
aead = "0.5"
hkdf = "0.12"
num-bigint = "0.4"
num-traits = "0.2"
openssl = { version = "0.10", features = ["vendored"], optional = true }
ibe = { version = "0.3.0", features = ["cgwfo"], optional = true }
rand08 = { package = "rand", version = "0.8", optional = true }
rand_chacha08 = { package = "rand_chacha", version = "0.3", optional = true }
serde_json = { version = "1.0", optional = true }
hex = { version = "0.4", optional = true }
binding-host = { path = "crates/binding-host", optional = true, default-features = false }
binding-core = { path = "crates/binding-core" }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "lhtlp_bench"
harness = false

[[bench]]
name = "ibe_bench"
harness = false

[[bench]]
name = "binding_proof_bench"
harness = false
